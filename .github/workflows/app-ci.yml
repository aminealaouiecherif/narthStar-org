name: "App CI"

run-name: App CI for ${{ inputs.service_name }}

on:
    
  push:
    branches: ["staging", "production"]
    paths:
      - "apps/**"
      - ".github/"

  pull_request:
    branches: ["staging", "production"]
    paths:
      - "apps/**"
      - ".github/"


jobs:
  build-and-scan:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - id: "wifAuth"
        name: "Authenticate to Google Cloud"
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com'
          token_format: "access_token"

      # Login is needed because Trivy pulls the image by reference
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} \
            -f app/backend/Dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
        