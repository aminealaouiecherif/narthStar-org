name: "App CI"

run-name: App CI for ${{ inputs.service_name }}

on:
  push:
    branches: ["dev",]
    paths:
      - "app/**"
      - ".github/"

  pull_request:
    branches: [dev]
    paths:
      - "app/**"
      - ".github/"


jobs:
  build-and-scan:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - id: "wifAuth"
        name: "Authenticate to Google Cloud"
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com'
          token_format: "access_token"

      # Docker login action
      - uses: 'docker/login-action@v1'
        with:
            registry: '${{ vars.REGION }}-docker.pkg.dev' 
            username: 'oauth2accesstoken'
            password: '${{ steps.wifAuth.outputs.access_token }}'

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} \
            -f app/backend/Dockerfile .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - run: docker push ${{ env.GCP_AR_URL }}/${{ inputs.service_name }}:${{ steps.runsha.outputs.runsha }}
        if: (( github.ref == 'refs/heads/stagging' || github.ref == 'refs/heads/production' ))
        shell: bash
        name: Push Container Image to GCP AR

      

        