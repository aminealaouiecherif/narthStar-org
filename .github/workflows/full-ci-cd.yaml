name: Cloud Run Full CI/CD

on:
    
  push:
    branches: ["staging", "production"]
    paths:
      - "apps/**"
      - ".github/"

  pull_request:
    branches: ["staging", "production"]
    paths:
      - "apps/**"
      - ".github/"

  workflow_dispatch:

jobs:
    CI-frontend:
      uses: aminealaouiecherif/narthStar-org/blob/dev/.github/workflows/app-ci.yml
      with:
        service_name: "northstar-frontend"
        buildpacks: "gcr.io/paketo-buildpacks/nginx"
        src_path: "apps/pandapple/src-front"
      secrets: inherit


    CI-backend:
      uses: aminealaouiecherif/narthStar-org/blob/dev/.github/workflows/app-ci.yml
      with:
        service_name: "northstar-backend"
        buildpacks: "gcr.io/paketo-buildpacks/nginx"
        src_path: "apps/front"
      secrets: inherit

    
    CD-pandapple-TF-deploy: #
      uses: aminealaouiecherif/narthStar-org/blob/dev/.github/workflows/app-ci.yml
      with:
        service_name: "pandapple-front"
        buildpacks: "gcr.io/paketo-buildpacks/nginx"
        src_path: ""
      secrets: inherit

    
    CD-pandapple-deploy: #Deploy to production environment
    #   if: github.ref == 'refs/heads/production' 
        needs: [CD-pandapple-TF-deploy]
        uses: afkl-airspace/actions-gcp/.github/workflows/tf_deploy.yaml@feature/cloudfun_full_cicd
        with:
            environment: "prd"
            terraform-apply: "true"
            working-directory: "./infra/"
        secrets: inherit